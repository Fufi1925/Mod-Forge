<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login – ModForge Dashboard</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="page-bg">
<div class="login-wrap">
  <div class="login-box">
    <div style="display:flex;align-items:center;gap:9px;margin-bottom:22px">
      <div class="brand-icon">🛡️</div>
      <span style="font-weight:900;font-size:1.15rem" class="grad">ModForge</span>
    </div>
    <h1>Dashboard Login</h1>
    <p class="lead">Melde dich mit Discord an um deine Server zu verwalten.</p>
    {% if error %}<div class="alert-err">{{ error }}</div>{% endif %}
    {% if info %}<div class="alert-info">{{ info }}</div>{% endif %}
    <a class="discord-login-btn" href="/auth/discord">
      <svg width="20" height="20" viewBox="0 0 71 55" fill="#fff"><path d="M60.1 4.9A58.5 58.5 0 0 0 45.6.4a40 40 0 0 0-1.8 3.6 54.1 54.1 0 0 0-16.2 0 36.5 36.5 0 0 0-1.8-3.6A58.4 58.4 0 0 0 10.9 4.9C1.6 18.6-.9 31.9.3 45a58.8 58.8 0 0 0 17.9 9 43 43 0 0 0 3.7-6 38.3 38.3 0 0 1-6-2.8l1.5-1.1a41.8 41.8 0 0 0 35.6 0l1.5 1.1a38 38 0 0 1-6 2.9 43 43 0 0 0 3.6 6 58.6 58.6 0 0 0 17.9-9C71.7 29.7 68.4 16.5 60.1 4.9ZM23.7 37c-3.5 0-6.4-3.2-6.4-7.1s2.8-7.1 6.4-7.1c3.6 0 6.5 3.2 6.4 7.1 0 3.9-2.8 7.1-6.4 7.1Zm23.6 0c-3.5 0-6.4-3.2-6.4-7.1s2.9-7.1 6.4-7.1c3.6 0 6.5 3.2 6.4 7.1 0 3.9-2.8 7.1-6.4 7.1Z"/></svg>
      Mit Discord anmelden
    </a>
    {% if admin_available %}
    <div style="text-align:center;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)">
      <a href="/admin/login" style="font-size:.75rem;color:var(--muted)">Admin-Login (Bot-Owner)</a>
    </div>{% endif %}
  </div>
</div>
</body>
</html>
