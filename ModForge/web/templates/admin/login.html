<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Login – ModForge</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    body { display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px }
    .login-card { max-width:400px;width:100%;padding:40px;border-radius:var(--radius);background:var(--glass2);border:1px solid var(--border);backdrop-filter:blur(20px) }
    .login-input { width:100%;padding:12px 16px;border-radius:12px;background:var(--glass3);border:1px solid var(--border);color:var(--fg);font-size:.88rem;outline:none;font-family:inherit;transition:border-color var(--r) }
    .login-input:focus { border-color:var(--vl) }
    .login-error { padding:12px 16px;border-radius:12px;background:rgba(239,68,68,0.1);border:1px solid rgba(248,113,113,0.25);color:var(--redl);font-size:.82rem;margin-bottom:20px }
  </style>
</head>
<body class="page-bg">
  <div class="login-card">
    <div style="text-align:center;margin-bottom:28px">
      <div style="font-size:2.5rem;margin-bottom:12px">🔐</div>
      <h1 style="font-size:1.4rem;font-weight:800;margin-bottom:4px">Admin Panel</h1>
      <p style="color:var(--muted);font-size:.82rem">Zugang nur für autorisiertes Personal.</p>
    </div>

    {% if error %}
    <div class="login-error">⚠️ {{ error }}</div>
    {% endif %}

    <form method="POST" action="/admin/login" style="display:flex;flex-direction:column;gap:16px">
      <div>
        <label style="font-size:.82rem;font-weight:600;margin-bottom:6px;display:block">Benutzername</label>
        <input type="text" name="username" class="login-input" placeholder="admin" required autocomplete="username">
      </div>
      <div>
        <label style="font-size:.82rem;font-weight:600;margin-bottom:6px;display:block">Passwort</label>
        <input type="password" name="password" class="login-input" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-glass btn-glass-primary" style="width:100%;justify-content:center;padding:14px;margin-top:4px">Anmelden</button>
    </form>

    <div style="text-align:center;margin-top:20px">
      <a href="/" style="color:var(--muted);font-size:.78rem">← Zurück zur Startseite</a>
    </div>
  </div>
</body>
</html>
