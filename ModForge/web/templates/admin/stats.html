<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Stats – ModForge</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .admin-nav { position:fixed;top:0;left:0;right:0;z-index:9999;height:60px;background:rgba(6,6,16,0.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:20px }
    .admin-nav a { color:var(--muted);font-size:.82rem;font-weight:600;transition:color var(--r) }
    .admin-nav a:hover,.admin-nav a.active { color:var(--fg) }
    .admin-body { padding-top:80px;max-width:1200px;margin:0 auto;padding-left:24px;padding-right:24px;padding-bottom:60px }
    .stat-card { padding:24px;border-radius:var(--radius);background:var(--glass2);border:1px solid var(--border);text-align:center }
    .stat-value { font-size:1.8rem;font-weight:900;margin-bottom:4px }
    .stat-label { font-size:.75rem;color:var(--muted) }
  </style>
</head>
<body class="page-bg">
  <nav class="admin-nav">
    <span style="font-weight:800;font-size:1rem;color:var(--vl);margin-right:auto">🔐 Admin</span>
    <a href="/admin/dashboard">Dashboard</a>
    <a href="/admin/guilds">Guilds</a>
    <a href="/admin/stats" class="active">Stats</a>
    <a href="/admin/logout" style="color:var(--redl)">Logout</a>
  </nav>

  <div class="admin-body">
    <h1 style="font-size:1.6rem;font-weight:800;margin-bottom:8px">System-Statistiken</h1>
    <p style="color:var(--muted);font-size:.88rem;margin-bottom:32px">Detaillierte Übersicht aller Metriken</p>

    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin-bottom:32px">
      <div class="stat-card">
        <div class="stat-value" style="color:var(--vl)">{{ gc }}</div>
        <div class="stat-label">Server</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" style="color:var(--cl)">{{ mc }}</div>
        <div class="stat-label">Mitglieder</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" style="color:var(--green)">{{ uptime_pct }}%</div>
        <div class="stat-label">Uptime</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" style="color:var(--amberl)">{{ lat }}ms</div>
        <div class="stat-label">Latenz</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" style="color:var(--p2)">{{ shard_count }}</div>
        <div class="stat-label">Shards</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" style="color:var(--orange)">{{ cases_count }}</div>
        <div class="stat-label">Cases</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" style="color:var(--info)">{{ archive_count }}</div>
        <div class="stat-label">Archiviert</div>
      </div>
    </div>
  </div>
</body>
</html>
