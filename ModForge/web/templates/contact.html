{% extends "base.html" %}
{% block title %}Kontakt – ModForge{% endblock %}
{% block content %}
<div class="container" style="max-width:700px;padding-top:40px;padding-bottom:80px">
  <div class="sec-head reveal" style="text-align:center;margin-bottom:40px">
    <div class="sec-badge" style="margin-bottom:12px">📬 Kontakt</div>
    <h1 style="font-size:clamp(1.8rem,4vw,2.4rem);font-weight:800;margin-bottom:12px">Kontakt aufnehmen</h1>
    <p style="color:var(--muted);max-width:500px;margin:0 auto">Wir sind für dich da – egal ob Frage, Feedback oder Partnerschaft.</p>
  </div>

  <div class="glass-card reveal" style="padding:32px;border-radius:var(--radius);background:var(--glass2);border:1px solid var(--border);margin-bottom:24px">
    <div style="display:flex;flex-direction:column;gap:20px">
      <div>
        <label style="font-size:.85rem;font-weight:600;margin-bottom:6px;display:block">Name</label>
        <input type="text" placeholder="Dein Name"
          style="width:100%;padding:12px 16px;border-radius:12px;background:var(--glass3);border:1px solid var(--border);color:var(--fg);font-size:.88rem;outline:none">
      </div>
      <div>
        <label style="font-size:.85rem;font-weight:600;margin-bottom:6px;display:block">E-Mail</label>
        <input type="email" placeholder="deine@email.de"
          style="width:100%;padding:12px 16px;border-radius:12px;background:var(--glass3);border:1px solid var(--border);color:var(--fg);font-size:.88rem;outline:none">
      </div>
      <div>
        <label style="font-size:.85rem;font-weight:600;margin-bottom:6px;display:block">Betreff</label>
        <select style="width:100%;padding:12px 16px;border-radius:12px;background:var(--glass3);border:1px solid var(--border);color:var(--fg);font-size:.88rem;outline:none">
          <option>Allgemeine Frage</option>
          <option>Bug Report</option>
          <option>Partnerschaft</option>
          <option>Enterprise</option>
          <option>Sonstiges</option>
        </select>
      </div>
      <div>
        <label style="font-size:.85rem;font-weight:600;margin-bottom:6px;display:block">Nachricht</label>
        <textarea rows="5" placeholder="Deine Nachricht…"
          style="width:100%;padding:12px 16px;border-radius:12px;background:var(--glass3);border:1px solid var(--border);color:var(--fg);font-size:.88rem;outline:none;resize:vertical;font-family:inherit"></textarea>
      </div>
      <button class="btn-glass btn-glass-primary" style="width:100%;justify-content:center;padding:14px">Nachricht senden</button>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px">
    <div class="glass-card reveal" style="padding:20px;border-radius:var(--radius);background:var(--glass2);border:1px solid var(--border);text-align:center">
      <div style="font-size:1.5rem;margin-bottom:8px">💬</div>
      <a href="https://discord.gg/modforge" style="color:var(--vl);font-size:.88rem;font-weight:600">Discord Server</a>
    </div>
    <div class="glass-card reveal" style="padding:20px;border-radius:var(--radius);background:var(--glass2);border:1px solid var(--border);text-align:center">
      <div style="font-size:1.5rem;margin-bottom:8px">📧</div>
      <span style="color:var(--vl);font-size:.88rem;font-weight:600">support@modforge.dev</span>
    </div>
    <div class="glass-card reveal" style="padding:20px;border-radius:var(--radius);background:var(--glass2);border:1px solid var(--border);text-align:center">
      <div style="font-size:1.5rem;margin-bottom:8px">🐦</div>
      <a href="#" style="color:var(--vl);font-size:.88rem;font-weight:600">@ModForge</a>
    </div>
  </div>
</div>
{% endblock %}
