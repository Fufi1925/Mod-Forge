<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Terminal · ModForge</title>
  <style>
    :root {
      --bg: #0c0c0c;
      --card: #1a1a1a;
      --green: #00ff88;
      --yellow: #ffcc00;
      --red: #ff3366;
      --blue: #00bfff;
      --fg: #cccccc;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'Courier New', monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: #111;
      border-bottom: 1px solid #333;
    }
    .topbar h1 { font-size: 1.2rem; font-weight: 700; letter-spacing: 1px; }
    .dot { color: #00ff88; }
    .terminal {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      font-size: 0.9rem;
      line-height: 1.5;
    }
    .log-entry {
      padding: 2px 0;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .timestamp { color: #888; margin-right: 10px; }
    .level-INFO    { color: var(--green); }
    .level-WARNING { color: var(--yellow); }
    .level-ERROR   { color: var(--red); }
    .level-DEBUG   { color: var(--blue); }
    .status-bar {
      padding: 6px 20px;
      background: #111;
      border-top: 1px solid #333;
      font-size: 0.75rem;
      color: #888;
      display: flex;
      gap: 20px;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
  </style>
</head>
<body>
  <div class="topbar">
    <h1><span class="dot">⬤</span> ModForge Live Terminal</h1>
    <a href="/admin/dashboard" style="color:var(--blue);text-decoration:none">← Admin Dashboard</a>
  </div>

  <div class="terminal" id="terminal">
    <div class="log-entry">ModForge Live Terminal gestartet …</div>
  </div>

  <div class="status-bar">
    <span id="status">Verbunden</span>
    <span id="count">0 Einträge</span>
  </div>

  <script>
    const term = document.getElementById('terminal');
    const status = document.getElementById('status');
    const count = document.getElementById('count');
    let lastLen = 0;

    function escapeHtml(text) {
      return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function renderLog(logs) {
      if (!logs.length) return;
      let html = '';
      for (const entry of logs) {
        const levelClass = `level-${entry.level}`;
        html += `<div class="log-entry"><span class="timestamp">[${entry.time}]</span><span class="${levelClass}">[${entry.level}]</span> ${escapeHtml(entry.msg)}</div>`;
      }
      term.innerHTML += html;
      term.scrollTop = term.scrollHeight;
    }

    async function fetchLogs() {
      try {
        const res = await fetch('/live/api/logs');
        const data = await res.json();
        if (data.length !== lastLen) {
          // Nur neue Einträge rendern
          const newLogs = data.slice(lastLen);
          renderLog(newLogs);
          lastLen = data.length;
        }
        count.textContent = `${data.length} Einträge`;
        status.textContent = 'Verbunden';
      } catch (err) {
        status.textContent = 'Fehler';
      }
    }

    fetchLogs(); // initial load
    setInterval(fetchLogs, 1000); // alle 1s poll
  </script>
</body>
</html>
