{% extends "base.html" %}
{% block title %}Vorschlag – ModForge{% endblock %}
{% block content %}
<div class="container" style="max-width:700px;padding-top:40px;padding-bottom:80px">
  <div class="sec-head reveal" style="text-align:center;margin-bottom:40px">
    <div class="sec-badge" style="margin-bottom:12px">💡 Vorschlag</div>
    <h1 style="font-size:clamp(1.8rem,4vw,2.4rem);font-weight:800;margin-bottom:12px">Feature vorschlagen</h1>
    <p style="color:var(--muted);max-width:500px;margin:0 auto">Hilf uns ModForge besser zu machen – teile deine Ideen!</p>
  </div>

  <div class="glass-card reveal" style="padding:32px;border-radius:var(--radius);background:var(--glass2);border:1px solid var(--border)">
    <div style="display:flex;flex-direction:column;gap:20px">
      <div>
        <label style="font-size:.85rem;font-weight:600;margin-bottom:6px;display:block">Feature-Titel</label>
        <input type="text" placeholder="z.B. Auto-Role bei Boost"
          style="width:100%;padding:12px 16px;border-radius:12px;background:var(--glass3);border:1px solid var(--border);color:var(--fg);font-size:.88rem;outline:none">
      </div>
      <div>
        <label style="font-size:.85rem;font-weight:600;margin-bottom:6px;display:block">Beschreibung</label>
        <textarea rows="5" placeholder="Beschreibe dein Feature ausführlich…"
          style="width:100%;padding:12px 16px;border-radius:12px;background:var(--glass3);border:1px solid var(--border);color:var(--fg);font-size:.88rem;outline:none;resize:vertical;font-family:inherit"></textarea>
      </div>
      <div>
        <label style="font-size:.85rem;font-weight:600;margin-bottom:6px;display:block">Kategorie</label>
        <select style="width:100%;padding:12px 16px;border-radius:12px;background:var(--glass3);border:1px solid var(--border);color:var(--fg);font-size:.88rem;outline:none">
          <option>Security</option>
          <option>Moderation</option>
          <option>AutoMod</option>
          <option>Dashboard</option>
          <option>Economy</option>
          <option>Sonstiges</option>
        </select>
      </div>
      <button class="btn-glass btn-glass-primary" style="width:100%;justify-content:center;padding:14px">Vorschlag einreichen</button>
    </div>
  </div>
</div>
{% endblock %}
