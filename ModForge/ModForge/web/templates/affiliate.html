{% extends "base.html" %}
{% block title %}Affiliate – ModForge{% endblock %}
{% block content %}
<div class="container" style="max-width:900px;padding-top:40px;padding-bottom:80px">
  <div class="sec-head reveal" style="text-align:center;margin-bottom:50px">
    <div class="sec-badge" style="margin-bottom:12px">💰 Affiliate</div>
    <h1 style="font-size:clamp(1.8rem,4vw,2.8rem);font-weight:800;margin-bottom:12px">Affiliate-Programm</h1>
    <p style="color:var(--muted);max-width:620px;margin:0 auto">Verdiene Provision, indem du ModForge weiterempfiehlst.</p>
  </div>

  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-bottom:40px;text-align:center">
    <div class="glass-card reveal" style="padding:28px;border-radius:var(--radius);background:var(--glass2);border:1px solid var(--border)">
      <div style="font-size:2.2rem;font-weight:900;color:var(--vl);margin-bottom:8px">20%</div>
      <p style="color:var(--muted);font-size:.85rem">Provision pro Verkauf</p>
    </div>
    <div class="glass-card reveal" style="padding:28px;border-radius:var(--radius);background:var(--glass2);border:1px solid var(--border)">
      <div style="font-size:2.2rem;font-weight:900;color:var(--cl);margin-bottom:8px">30</div>
      <p style="color:var(--muted);font-size:.85rem">Tage Cookie-Laufzeit</p>
    </div>
    <div class="glass-card reveal" style="padding:28px;border-radius:var(--radius);background:var(--glass2);border:1px solid var(--border)">
      <div style="font-size:2.2rem;font-weight:900;color:var(--green);margin-bottom:8px">€10</div>
      <p style="color:var(--muted);font-size:.85rem">Min. Auszahlung</p>
    </div>
  </div>

  <div class="reveal" style="text-align:center">
    <a href="/contact" class="btn-glass btn-glass-primary btn-lg">Jetzt bewerben →</a>
  </div>
</div>
{% endblock %}
